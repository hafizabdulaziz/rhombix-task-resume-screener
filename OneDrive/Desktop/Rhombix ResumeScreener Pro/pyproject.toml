[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhombix-resumescreener-pro"
version = "1.0.0"
description = "Enterprise-grade AI & Hybrid Resume Screening & Candidate Matching Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Hafiz Abdul Aziz", email = "hafizabdulaziz@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "jinja2>=3.1.4",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "scikit-learn>=1.6.0",
    "nltk>=3.9.1",
    "spacy>=3.8.2",
    "sentence-transformers>=3.3.1",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.10.0",
    "slowapi>=0.1.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.3",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
