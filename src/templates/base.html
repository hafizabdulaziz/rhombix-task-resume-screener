<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rhombix ResumeScreener Pro{% endblock %}</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        emerald: { 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Navbar -->
    <header class="bg-slate-850 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-950 font-bold px-3 py-1 rounded-lg text-sm tracking-wide">R-PRO</div>
                <span class="font-bold text-lg tracking-tight text-white">Rhombix <span class="text-emerald-500">ResumeScreener</span></span>
            </div>
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <a href="/" class="hover:text-emerald-400 transition-colors">Dashboard</a>
                <a href="/jobs" class="hover:text-emerald-400 transition-colors">Job Descriptions</a>
                <a href="/upload" class="hover:text-emerald-400 transition-colors">Upload Resumes</a>
            </nav>
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    v1.0.0 Enterprise
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-850 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Rhombix ResumeScreener Pro. Enterprise Cyber-Minimalist Edition.</p>
    </footer>
</body>
</html>
