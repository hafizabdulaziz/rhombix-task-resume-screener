<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Premium Silver Enterprise Portal - Rhombix ResumeScreener Pro{% endblock %}</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
                        blue: { 600: '#2563eb', 700: '#1d4ed8' },
                        silver: { 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8' }
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-slate-200 to-slate-400 text-slate-900 font-bold px-3 py-1 rounded-md text-sm tracking-wide shadow">RHOMBIX</div>
                <span class="font-bold text-lg tracking-tight text-white">ResumeScreener <span class="text-blue-400">Pro Enterprise</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/docs" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-silver-200 px-3 py-1.5 rounded border border-slate-600 transition-colors">
                    API Docs (/docs)
                </a>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-300 border border-blue-500/30">
                    Silver Edition v1.0
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-700 py-6 text-center text-xs text-silver-400">
        <p>&copy; 2026 Rhombix ResumeScreener Pro. Premium Silver Enterprise Workspace.</p>
    </footer>
</body>
</html>
